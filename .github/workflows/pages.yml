name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  browser-smoke:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        viewport: [desktop, medium, mobile]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Chromium
        run: npx --yes playwright install --with-deps chromium

      - name: Run browser smoke
        env:
          PLAYWRIGHT_CLI: npx --yes --package @playwright/cli playwright-cli
          PADELSTAR_SMOKE_VIEWPORT: ${{ matrix.viewport }}
        run: bash scripts/browser-smoke.sh

  deploy:
    needs: browser-smoke
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

      - name: Check JavaScript syntax
        run: npm run check:syntax

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
